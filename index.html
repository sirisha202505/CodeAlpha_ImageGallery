<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CodeAlpha Image Gallery</h1>
    <div class="filters">
    <button onclick="filterImages('all')">All</button>
    <button onclick="filterImages('nature')">Nature</button>
    <button onclick="filterImages('animal')">Animals</button>
    <button onclick="filterImages('travel')">Travel</button>
</div>
    

    <div class="gallery">
    <img src="https://picsum.photos/id/1015/300/200" class="nature">
    <img src="https://picsum.photos/id/1016/300/200" class="nature">

    <img src="https://picsum.photos/id/1024/300/200" class="animal">
    <img src="https://picsum.photos/id/1025/300/200" class="animal">

    <img src="https://picsum.photos/id/1035/300/200" class="travel">
    <img src="https://picsum.photos/id/1040/300/200" class="travel">
</div>
    

    <div id="lightbox" class="lightbox">
        <span class="close">&times;</span>
        <img id="lightbox-img" src="">
    </div>

    <script src="script.js"></script>

</body>
</html>
